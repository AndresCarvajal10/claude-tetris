<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">MODO CLARO</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li>💣 bomba: destruye 3×3</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-extra" class="records-extra hidden">
          <form id="name-form" class="name-form hidden">
            <label for="name-input">¡Nuevo record! Tu nombre:</label>
            <div class="name-row">
              <input type="text" id="name-input" maxlength="12" autocomplete="off" />
              <button type="submit" id="save-name-btn">Guardar</button>
            </div>
          </form>
          <div id="over-records"></div>
          <button type="button" class="reset-records-btn">Borrar records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay hidden">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <p class="label">TOP 5</p>
        <div id="start-records"></div>
        <button id="start-btn" class="primary-btn">Jugar</button>
        <button type="button" class="reset-records-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
